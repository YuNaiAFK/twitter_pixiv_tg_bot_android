# The version of the bot manager - the app, the panel and the scripts, which ship together.
#
# **This is the only place the number is written down.** app/build.ps1 reads it and hands it to
# aapt2; control/panel.py reads it and reports it on /api/status; the app shows its own version
# from its package metadata and the panel's from that endpoint. So all of them agree by
# construction instead of by three people remembering.
#
# That was the problem this replaced: the number was inline in build.ps1, nothing displayed it,
# and the panel had no version at all - so the app, the panel and the release tag could all
# disagree with no way to tell which build was on the phone.
#
# ## The rule
#
# Bump this whenever a feature changes.
#
#   versionName   what a person reads, Major.Minor.Patch:
#
#                   Major  something that changes how it is used, or breaks the panel API
#                          so an old app cannot drive a new panel
#                   Minor  a new feature or a visible behaviour change
#                   Patch  a fix with no new capability
#
#   versionCode   integer, Android only, and it must go UP every time. Android refuses to install
#                 an APK whose versionCode is not greater than the one already installed, so this
#                 is what makes `adb install -r` work. It is not shown to anyone.
#
# `app/build.ps1 -Bump` increments the minor part and writes both keys back here, so bumping is
# one flag rather than an edit that is easy to forget. `-Bump -Fix` does a patch instead.
#
# build.ps1 also warns when the app's sources changed since the last bump, which is the reminder
# that the rule applies. VERSIONS.md lists what each version contained.
#
versionName=1.5
versionCode=7
